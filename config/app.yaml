# Application settings. Policy values live in config/policy/*.yaml.
institutionName: "Great Lakes Institute of Management"
appTitle: "RTS Faculty Portal"
pdfTemplateVersion: "rts-pdf-1.0"

features:
  facultyDirectDownload: true        # faculty can download their own PDFs in the portal
  facultyEmailCorrectionRequests: true
  evidenceUploads: false             # not in first release

notifications:
  adminOnSubmission: true            # uses ADMIN_NOTIFY_EMAIL
  facultyOnClarification: true
  facultyOnDecision: true

email:
  maxAutomaticAttempts: 3            # bounded retries for transient provider failures
  # Placeholders: {{name}} {{year}} {{status}} {{reference}} {{link}} {{message}}
  # ACCESS_CODE also has {{code}}; POLICY_* also have {{policy}} {{oldPoints}} {{newPoints}}.
  # Subjects deliberately avoid submission details.
  templates:
    INITIAL_EXPORT:
      subject: "RTS submission received — {{year}}"
      body: |
        Dear {{name}},

        Thank you. Your RTS submission for {{year}} has been received (reference {{reference}}).
        A PDF copy of your submission is attached, showing the points you submitted.
        Approved points will be sent in a final statement once the Admin completes the review.

        Please confirm in the portal whether you received this email: {{link}}

        RTS Office
    FINAL_EXPORT:
      subject: "RTS review completed — {{year}}"
      body: |
        Dear {{name}},

        The review of your RTS submission for {{year}} (reference {{reference}}) is complete.
        The attached PDF shows your submitted points alongside the Admin-approved points.

        Please confirm receipt in the portal: {{link}}

        RTS Office
    RESEND_EXPORT:
      subject: "RTS document — {{year}}"
      body: |
        Dear {{name}},

        As requested, the latest PDF for your RTS submission for {{year}} (reference {{reference}}) is attached.

        Please confirm receipt in the portal: {{link}}

        RTS Office
    STATUS_NOTICE:
      subject: "RTS submission update — {{year}}"
      body: |
        Dear {{name}},

        There is an update on your RTS submission for {{year}}: {{status}}.
        {{message}}

        Please sign in to the portal for details: {{link}}

        RTS Office
    ADMIN_NOTICE:
      subject: "New RTS submission received"
      body: |
        A faculty member has submitted their RTS record for {{year}} (reference {{reference}}).
        Review it in the Admin portal: {{link}}
    ACCESS_CODE:
      subject: "Your RTS portal access code"
      body: |
        Dear {{name}},

        A personal access code has been issued for you on the RTS Faculty Portal.

        Access code: {{code}}

        Sign in at {{link}} by selecting your name and entering this code.
        Keep it private — it works only for you. Any earlier code no longer works.
        If you did not expect this email, please contact the RTS Office.

        RTS Office
    POLICY_RECOMPUTED:
      subject: "RTS points recalculated — {{year}}"
      body: |
        Dear {{name}},

        The RTS points policy for {{year}} has been updated to {{policy}}, and your submission
        (reference {{reference}}) has been recalculated under it.

        Previous submitted points: {{oldPoints}}
        New submitted points:      {{newPoints}}

        The attached PDF shows the recalculated points. The Admin will now review and approve
        the recalculated record; you will receive a final statement after approval.
        {{message}}

        Details: {{link}}

        RTS Office
    POLICY_DRAFT_NOTICE:
      subject: "RTS points policy updated — {{year}}"
      body: |
        Dear {{name}},

        The RTS points policy for {{year}} has been updated to {{policy}}. Your draft submission
        (not yet submitted) now uses the new values.

        Draft points under the previous policy: {{oldPoints}}
        Draft points under the new policy:      {{newPoints}}

        Please sign in, check your draft and submit it: {{link}}
        {{message}}

        RTS Office
